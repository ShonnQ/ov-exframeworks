<rect x="695.0" y="118" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="705.0" y="140.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">SystemServer 反射</text>
<text x="705.0" y="156.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">插件起定制服务</text>
<rect x="20" y="208" width="860" height="92" rx="8" fill="#f6f8f9" stroke="#c9d2da"/>
<rect x="20" y="208" width="4" height="92" rx="2" fill="#2e7d32"/>
