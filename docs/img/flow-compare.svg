<line x1="695.0" y1="95" x2="880.0" y2="95" stroke="#c9d2da"/>
<rect x="20" y="104" width="860" height="92" rx="8" fill="#f6f8f9" stroke="#c9d2da"/>
<rect x="20" y="104" width="4" height="92" rx="2" fill="#1565c0"/>
<text x="38.0" y="140.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="14" fill="#1565c0" font-weight="700" text-anchor="start">OPPO</text>
<text x="38.0" y="159.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="9.5" fill="#94a1ad" font-weight="normal" text-anchor="start">Android 11 · K7</text>
