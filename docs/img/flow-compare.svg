<text x="38.0" y="263.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="9.5" fill="#94a1ad" font-weight="normal" text-anchor="start">Android 12 · Z1x</text>
<rect x="104.0" y="222" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="114.0" y="244.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">OTA 刷入 vgc 分区</text>
<text x="114.0" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">+ cota_vgc.img（A/B）</text>
<path d="M 290.0 254.0 h 8" stroke="#c9d2da" stroke-width="1.4"/>
<path d="M 295.0 251.0 l 3 3 l -3 3" fill="none" stroke="#c9d2da" stroke-width="1.4"/>
<rect x="301.0" y="222" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="311.0" y="244.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">VivoVgcService 读</text>
<text x="311.0" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">XML / prop</text>
<path d="M 487.0 254.0 h 8" stroke="#c9d2da" stroke-width="1.4"/>
<path d="M 492.0 251.0 l 3 3 l -3 3" fill="none" stroke="#c9d2da" stroke-width="1.4"/>
<rect x="498.0" y="222" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="508.0" y="244.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">按 carrier / SIM</text>
<text x="508.0" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">选配置集</text>
<path d="M 684.0 254.0 h 8" stroke="#c9d2da" stroke-width="1.4"/>
<path d="M 689.0 251.0 l 3 3 l -3 3" fill="none" stroke="#c9d2da" stroke-width="1.4"/>
<rect x="695.0" y="222" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="705.0" y="244.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">加载配置与定制 APK</text>
<text x="705.0" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">插拔卡即时重载</text>
<rect x="20" y="318" width="860" height="51" rx="8" fill="#e9f8f5" stroke="#0f9d8a"/>
<text x="38.0" y="342.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11.5" fill="#0f9d8a" font-weight="700" text-anchor="start">同一件事，两种时点</text>
<text x="38.0" y="361.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="10.8" fill="#12181f" font-weight="normal" text-anchor="start">OPPO 把结果在编译期定死 —— 改内容就是重刷分区、重新开机；vivo 把选择留到运行期 —— 改内容等于换配置或换卡，不必重刷。</text>
</svg>