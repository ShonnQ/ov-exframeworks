<svg xmlns="http://www.w3.org/2000/svg" width="900" height="387" viewBox="0 0 900 387" role="img" aria-label="从刷机到生效：同一件事，四个阶段">
<rect width="900" height="387" fill="#ffffff"/>
<rect x="0" y="0" width="900" height="3" fill="#0f9d8a"/>
<text x="20.0" y="36.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="16.5" fill="#12181f" font-weight="700" text-anchor="start">从刷机到生效：同一件事，四个阶段</text>
