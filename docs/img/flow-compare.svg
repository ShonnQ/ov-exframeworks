<text x="114.0" y="140.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">OTA 刷入 10 个</text>
<text x="114.0" y="156.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="normal" text-anchor="start">my_* 分区</text>
<path d="M 290.0 150.0 h 8" stroke="#c9d2da" stroke-width="1.4"/>
