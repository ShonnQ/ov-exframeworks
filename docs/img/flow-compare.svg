<rect x="301.0" y="118" width="185.0" height="64" rx="6" fill="#ffffff" stroke="#c9d2da"/>
<text x="311.0" y="140.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Arial,sans-serif" font-size="11" fill="#12181f" font-weight="600" text-anchor="start">init 挂载分区，</text>
